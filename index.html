  <script>
    /* ---------- Rewritten client logic (keeps original behavior) ---------- */

    // Simple UI builder for the pill nav (replaces the custom Button library)
    function createPill(text, targetId) {
      const el = document.createElement('button');
      el.className = 'pill';
      el.textContent = text;
      el.dataset.target = targetId;
      el.addEventListener('click', () => {
        const target = document.getElementById('section-' + targetId);
        if (target) {
          window.scrollTo({ top: target.offsetTop - 30, behavior: 'smooth' });
        }
      });
      return el;
    }

    // Initialize after DOM
    document.addEventListener('DOMContentLoaded', () => {
      const root = document.getElementById('site-root');
      const loader = document.getElementById('page-loader');
      const navpills = document.getElementById('navpills');

      // create pills
      ['home','about','experience','skills','production','projects','education','contact'].forEach(name => {
        navpills.appendChild(createPill(name[0].toUpperCase() + name.slice(1), name));
      });

      // show page after a short simulated load (keeps same UX)
      setTimeout(() => {
        loader.style.display = 'none';
        navpills.setAttribute('aria-hidden','false');
        root.style.display = 'block';
        // optional small auto scroll to home area similar to original behavior:
        const home = document.getElementById('section-home');
        if (home) window.scrollTo({ top: Math.max(0, home.offsetTop - (home.offsetTop * 0.2)), behavior:'smooth' });
      }, 600);

      // restrict scrolling above home initially (replicates the scroll-blocking idea)
      let blockScroll = true;
      window.addEventListener('scroll', () => {
        if (!blockScroll) return;
        const home = document.getElementById('section-home');
        if (!home) return;
        const allowed = Math.max(0, home.offsetTop - (home.offsetTop * 0.2));
        if (window.scrollY < allowed) {
          window.scrollTo({ top: allowed, behavior: 'auto' });
        }
      });
      const sectionNames = ['home','about','experience','skills','production','projects','education','contact'];
      const pillMap = Object.fromEntries(Array.from(navpills.querySelectorAll('.pill')).map(p => [p.dataset.target, p]));
      const sections = sectionNames
        .map(name => ({ name, el: document.getElementById('section-' + name) }))
        .filter(item => item.el);

      const setActivePill = (name) => {
        Object.values(pillMap).forEach(p => p.classList.remove('active'));
        if (pillMap[name]) pillMap[name].classList.add('active');
      };

      const updateActiveFromScroll = () => {
        const marker = window.scrollY + (window.innerHeight * 0.35);
        let active = sections[0]?.name || 'home';
        sections.forEach(({ name, el }) => {
          if (el.offsetTop <= marker) active = name;
        });
        setActivePill(active);
      };

      window.addEventListener('scroll', updateActiveFromScroll, { passive: true });
      sectionNames.forEach(name => {
        const pill = pillMap[name];
        const section = document.getElementById('section-' + name);
        if (!pill || !section) return;
        pill.addEventListener('click', () => setActivePill(name));
      });

      updateActiveFromScroll();

      // remove scroll block after 1.2s to mimic original sequence
      setTimeout(() => {
        blockScroll = false;
        updateActiveFromScroll();
      }, 1200);
    });
  </script>
